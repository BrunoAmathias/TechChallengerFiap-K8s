apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ required "auth.username é obrigatório" .Values.auth.username | quote }}
  password: {{ required "auth.password é obrigatório" .Values.auth.password | quote }}
