name: CI - Validação Terraform (Neon)

on:
  pull_request:
    branches:
      - main
      - Homolog
      - Dev

permissions:
  contents: read

defaults:
  run:
    working-directory: TFs

jobs:
  validate:
    name: Validar infraestrutura Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

    steps:
      - name: Checkout código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@463133d79af6d001e45482f356e244208e65f0c5 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validar identidade AWS
        run: |
          aws sts get-caller-identity

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Validar secrets obrigatórios
        run: |
          test -n "$NEON_API_KEY" || {
            echo "NEON_API_KEY não foi configurado"
            exit 1
          }

          test -n "$TF_VAR_newrelic_license_key" || {
            echo "NEW_RELIC_LICENSE_KEY não foi configurado"
            exit 1
          }

          echo "Secrets obrigatórios encontrados."

      - name: Checar formatação
        run: |
          terraform fmt -check -recursive

      - name: Validar backend S3
        run: |
          if ! aws s3api head-bucket \
            --bucket fiap-techchallenger 2>/dev/null; then
            echo "O bucket fiap-techchallenger não existe ou não está acessível."
            exit 1
          fi

          if ! aws s3api head-object \
            --bucket fiap-techchallenger \
            --key eks/terraform.tfstate \
            >/dev/null 2>&1; then
            echo "O arquivo eks/terraform.tfstate não foi encontrado."
            exit 1
          fi

          echo "Bucket e arquivo de state encontrados."

      - name: Inicializar Terraform
        run: |
          terraform init \
            -input=false \
            -reconfigure

      - name: Validar sintaxe
        run: |
          terraform validate

      - name: Gerar plano
        run: |
          terraform plan \
            -input=false \
            -no-color