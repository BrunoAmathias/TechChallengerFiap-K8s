name: CI - Validação Terraform (Neon)

on:
  pull_request:
    branches:
      - main
      - Homolog
      - Dev

permissions:
  contents: read

defaults:
  run:
    working-directory: TFs

jobs:
  validate:
    name: Validar infraestrutura Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_newrelic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validar identidade AWS
        run: aws sts get-caller-identity

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Validar secrets obrigatórios
        run: |
          test -n "$NEON_API_KEY" || {
            echo "NEON_API_KEY não foi configurado"
            exit 1
          }

          test -n "$TF_VAR_newrelic_license_key" || {
            echo "NEW_RELIC_LICENSE_KEY não foi configurado"
            exit 1
          }

          echo "Secrets obrigatórios encontrados."

      - name: Checar formatação
        run: terraform fmt -check -recursive

      - name: Validar backend S3
        run: |
          if ! aws s3api head-bucket \
            --bucket techchallenge-dev-tfstate 2>/dev/null; then
            echo "O bucket techchallenge-dev-tfstate não existe ou não está acessível."
            exit 1
          fi

          echo "Backend S3 encontrado."

      - name: Inicializar Terraform
        run: terraform init -input=false

      - name: Validar sintaxe
        run: terraform validate

      - name: Gerar plano
        run: |
          terraform plan \
            -input=false \
            -no-color